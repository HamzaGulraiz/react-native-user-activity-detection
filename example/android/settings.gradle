pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'useractivitydetection.example'

include ':app'

// 👉 Add your library module manually for Old Architecture support
include ':react-native-user-activity-detection'
project(':react-native-user-activity-detection').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-user-activity-detection/android')

includeBuild('../node_modules/@react-native/gradle-plugin')
